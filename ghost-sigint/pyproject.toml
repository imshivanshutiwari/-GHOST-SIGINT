[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ghost-sigint"
version = "1.0.0"
description = "Military-grade RF Signal Intelligence System"
requires-python = ">=3.11"
license = {text = "PROPRIETARY"}
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","W","I","N","UP","B","C4","SIM"]
ignore  = ["E501","N803","N806","B006","SIM108"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --cov=backend --cov-report=term-missing"

[tool.coverage.run]
source = ["backend"]
omit   = ["backend/tests/*"]
